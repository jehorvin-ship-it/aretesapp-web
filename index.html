<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F5E3B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AretesApp</title>
<style>
  :root{--primary:#00d2ff;--bg:#0f172a;--card:#1e293b;--text:#f8fafc;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;}
  html,body{overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none;}
  body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
  h1{color:var(--primary);font-weight:300;margin-bottom:6px;text-align:center;}
  p.sub{color:#5E6E63;margin-top:0;text-align:center;font-size:.9rem;}
  .grid{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:30px;}
  a.card{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:30px 26px;width:230px;text-decoration:none;color:var(--text);text-align:center;transition:.2s;}
  a.card:hover{border-color:var(--primary);transform:translateY(-3px);}
  a.card .ico{font-size:2.4rem;}
  a.card h2{color:var(--primary);font-size:1.15rem;margin:12px 0 6px;}
  a.card span{font-size:.82rem;color:#5E6E63;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=5">
</head>
<body>
  <div style="text-align:center"><div class="logo-badge" style="display:inline-flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:22px;margin:6px 0 10px"></div></div>
  <h1>AretesApp</h1>
  <p class="sub">Control de entrega y trazabilidad de aretes · Operadora El Tortuguero</p>
  <div class="grid">
    <a class="card" href="habilitado.html">
      <div class="ico">📱</div>
      <h2>Portal del Habilitado</h2>
      <span>Crear expedientes y ver mis entregas</span>
    </a>
    <a class="card" href="movimiento.html">
      <div class="ico">🐄</div>
      <h2>Movimientos</h2>
      <span>Cartas de venta del personal de movimientos</span>
    </a>
    <a class="card" href="digitador.html">
      <div class="ico">💻</div>
      <h2>Panel del Digitador</h2>
      <span>Aprobar pedidos y datos para el IPSA</span>
    </a>
  </div>
</body>
</html>
