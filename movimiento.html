<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F5E3B">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Movimientos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Movimientos - AretesApp</title>
<style>
  :root{
    --primary:#00d2ff; --primary-d:#0891b2;
    --bg:#0b1120; --bg2:#101a30; --card:#18233a; --card2:#1f2c47;
    --text:#f1f5f9; --muted:#9aa8bd; --line:rgba(255,255,255,.12);
    --success:#10b981; --warn:#f59e0b; --danger:#ef4444;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --nav-h:66px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;overflow-x:clip;}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);
       font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  input,textarea,button{font-family:inherit;font-size:17px;}
  .oculto{display:none !important;}

  /* login */
  #loginView{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
             padding:calc(var(--safe-t) + 26px) 20px calc(var(--safe-b) + 26px);max-width:520px;margin:0 auto;}
  .logo-wrap{text-align:center;margin-bottom:26px;}
  .logo-badge{width:88px;height:88px;border-radius:26px;background:linear-gradient(145deg,#F2B705,#E0A800);
              border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:40px;}
  .logo-wrap h1{color:var(--primary);font-weight:700;font-size:1.5rem;margin:0;}
  .logo-wrap p{color:var(--muted);font-size:.95rem;margin:6px 0 0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;}
  .lbl{display:block;font-size:.9rem;color:var(--muted);margin:0 0 7px 3px;font-weight:600;}
  .inp{width:100%;padding:15px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);}
  .inp:focus{outline:none;border-color:var(--primary);}
  textarea.inp{min-height:92px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:16px;}
  .field{margin-bottom:14px;}
  .btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:800;font-size:1.04rem;cursor:pointer;
       background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#04202a;}
  .btn:active{transform:scale(.98);} .btn:disabled{opacity:.55;}
  .btn-ghost{background:transparent;border:1.5px solid var(--primary);color:var(--primary);}
  .btn-sm{width:auto;padding:11px 16px;font-size:.95rem;}
  .msg{padding:12px 14px;border-radius:12px;margin-top:12px;font-size:.95rem;}
  .msg-err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3);}
  .msg-ok{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.3);}
  .msg-info{background:rgba(0,210,255,.08);color:var(--primary);border:1px solid rgba(0,210,255,.25);}

  /* app */
  #appView{padding:calc(var(--safe-t) + 10px) 14px calc(var(--nav-h) + var(--safe-b) + 20px);max-width:620px;margin:0 auto;}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .top b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw;}
  .top small{color:var(--muted);}
  .icon-btn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1.2rem;cursor:pointer;}
  .puente{font-size:.82rem;margin:-6px 4px 14px;}
  .paso{display:flex;align-items:center;gap:10px;margin:0 0 12px;}
  .paso .n{width:30px;height:30px;border-radius:50%;background:rgba(0,210,255,.15);color:var(--primary);display:flex;
           align-items:center;justify-content:center;font-weight:800;flex:none;}
  .paso.ok .n{background:var(--success);color:#fff;}
  .paso h3{margin:0;font-size:1.05rem;}
  .bloqueado{opacity:.45;pointer-events:none;}
  .arete{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg2);
         margin-top:8px;border-left:3px solid var(--success);font-size:.92rem;}
  .arete.mal{border-left-color:var(--danger);}
  .arete .cod{font-family:ui-monospace,Consolas,monospace;font-weight:700;}
  .arete small{color:var(--muted);display:block;}
  .dato{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--bg2);border-radius:11px;margin-bottom:8px;font-size:.93rem;}
  .dato span:first-child{color:var(--muted);} .dato span:last-child{text-align:right;font-weight:600;word-break:break-word;}
  .chip{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);
        color:var(--text);margin-top:8px;cursor:pointer;font-size:.95rem;}
  .chip.sel{border-color:var(--success);background:rgba(16,185,129,.1);}
  .chip small{color:var(--muted);}
  .foto-prev{width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:10px;background:#000;}
  .fijos{font-size:.84rem;color:var(--muted);margin-top:10px;}
  .mov{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;}
  .mov .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .pill{padding:5px 11px;border-radius:20px;font-size:.78rem;font-weight:800;white-space:nowrap;}
  .p-PENDIENTE{background:rgba(245,158,11,.15);color:#fcd34d;} .p-REGISTRANDO{background:rgba(0,210,255,.15);color:var(--primary);} .p-REGISTRADO{background:rgba(16,185,129,.15);color:#6ee7b7;}
  .p-ERROR{background:rgba(239,68,68,.15);color:#fca5a5;} .p-ANULADO{background:rgba(148,163,189,.15);color:#5E6E63;}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,210,255,.3);border-top-color:var(--primary);
        border-radius:50%;animation:g 0.8s linear infinite;vertical-align:-3px;margin-right:6px;}
  @keyframes g{to{transform:rotate(360deg)}}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(15,23,42,.9);backdrop-filter:blur(14px);
             border-top:1px solid var(--line);display:flex;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);}
  .bottomnav button{flex:1;background:none;border:none;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;
                    align-items:center;justify-content:center;gap:4px;font-size:.8rem;font-weight:700;}
  .bottomnav button .bi{font-size:1.5rem;line-height:1;}
  .bottomnav button.on{color:var(--primary);}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=5">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView">
  <div class="logo-wrap">
    <div class="logo-badge">🐄</div>
    <h1>Movimientos</h1>
    <p>Cartas de venta · Operadora El Tortuguero</p>
  </div>
  <div class="card" style="padding:22px 18px">
    <div class="field"><label class="lbl">Usuario</label>
      <input id="inUsuario" class="inp" autocomplete="username" autocapitalize="none" placeholder="Ej: maria.lopez"></div>
    <div class="field"><label class="lbl">Contraseña</label>
      <input id="inPass" class="inp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()"></div>
    <button class="btn" id="btnEntrar" onclick="entrar()">ENTRAR</button>
    <div id="loginMsg"></div>
  </div>
  <p style="text-align:center;color:var(--muted);font-size:.88rem">Si no puedes entrar, contacta al digitador.</p>
</div>

<!-- ============ APP ============ -->
<div id="appView" class="oculto">
  <div class="top">
    <div><b id="topNombre"></b><small id="topUsuario"></small></div>
    <button class="icon-btn" onclick="salir()" title="Salir">⏻</button>
  </div>
  <div class="puente" id="puenteTxt"></div>

  <!-- NUEVO MOVIMIENTO -->
  <section id="secNuevo">
    <!-- Paso 1 -->
    <div class="card" id="c1">
      <div class="paso" id="p1"><div class="n">1</div><h3>Aretes</h3></div>
      <label class="lbl">Escribe o pega los códigos (uno por línea, o separados por espacio)</label>
      <textarea id="aretesIn" class="inp" inputmode="numeric" placeholder="012730854&#10;016024650"></textarea>
      <div style="margin-top:10px"><button class="btn btn-ghost" id="btnVerif" onclick="verificarAretes()">Verificar aretes en el SNITB</button></div>
      <div id="aretesRes"></div>
    </div>

    <!-- Paso 2 -->
    <div class="card bloqueado" id="c2">
      <div class="paso" id="p2"><div class="n">2</div><h3>Origen (vendedor)</h3></div>
      <div id="origenRes"><div style="color:var(--muted);font-size:.92rem">Se llena solo con los aretes.</div></div>
    </div>

    <!-- Paso 3 -->
    <div class="card bloqueado" id="c3">
      <div class="paso" id="p3"><div class="n">3</div><h3>Destino (comprador)</h3></div>
      <label class="lbl">Cédula / CUPA del comprador</label>
      <div style="display:flex;gap:8px">
        <input id="cupaDest" class="inp" autocapitalize="characters" placeholder="Ej: 6192707971001F" style="flex:1"
               onkeydown="if(event.key==='Enter')buscarDestino()">
        <button class="btn btn-sm" onclick="buscarDestino()">Buscar</button>
      </div>
      <div id="destinoRes"></div>
    </div>

    <!-- Paso 4 -->
    <div class="card bloqueado" id="c4">
      <div class="paso" id="p4"><div class="n">4</div><h3>Carta de venta</h3></div>
      <div class="field"><label class="lbl">Número de la carta de venta</label>
        <input id="nodoc" class="inp" inputmode="numeric" placeholder="Ej: 571010" oninput="revisarListo()"></div>
      <label class="lbl">Foto de la carta de venta</label>
      <input id="fotoIn" type="file" accept="image/*" capture="environment" class="oculto" onchange="tomarFoto(this)">
      <button class="btn btn-ghost" onclick="document.getElementById('fotoIn').click()">📷 Tomar / elegir foto</button>
      <img id="fotoPrev" class="foto-prev oculto" alt="Foto de la carta">
      <div class="fijos">Se registra como <b>Carta de Venta</b> · técnico de campo <b>3309</b> · fecha de hoy.</div>
    </div>

    <button class="btn" id="btnEnviar" onclick="enviar(false)" disabled>ENVIAR MOVIMIENTO</button>
    <div id="enviarMsg"></div>
  </section>

  <!-- MIS MOVIMIENTOS -->
  <section id="secMios" class="oculto">
    <div id="listaMios"><div class="empty">Cargando…</div></div>
  </section>
</div>

<nav class="bottomnav oculto" id="nav">
  <button class="on" id="navNuevo" onclick="verSec('nuevo')"><span class="bi">＋</span>Nuevo</button>
  <button id="navMios" onclick="verSec('mios')"><span class="bi">📋</span>Mis movimientos</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="config.js?v=10"></script>
<script src="backend.js?v=13"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let origen = null, destino = null, aretesOk = [], fotoBlob = null, fotoSubida = null;

  /* ---------- sesión ---------- */
  async function entrar(){
    const btn = $('btnEntrar'); btn.disabled = true; $('loginMsg').innerHTML = '';
    try {
      const r = await Backend.mov.login($('inUsuario').value, $('inPass').value);
      if (r.status !== 'ok') { $('loginMsg').innerHTML = '<div class="msg msg-err">' + esc(r.message) + '</div>'; btn.disabled = false; return; }
      abrirApp(r.usuario); recuperarBorrador();
    } catch (e) { $('loginMsg').innerHTML = '<div class="msg msg-err">Error de conexión. Revisa tu internet.</div>'; }
    btn.disabled = false;
  }
  function abrirApp(u){
    $('loginView').classList.add('oculto'); $('appView').classList.remove('oculto'); $('nav').classList.remove('oculto');
    $('topNombre').textContent = u.nombre; $('topUsuario').textContent = 'Usuario: ' + u.usuario;
    estadoPuente(); setInterval(estadoPuente, 30000);
  }
  async function salir(){ if (!confirm('¿Cerrar sesión?')) return; try { localStorage.removeItem('aretesapp_mov_borrador'); localStorage.removeItem('aretesapp_mov_borrador_foto'); } catch (e) {} await Backend.mov.logout(); location.reload(); }
  window.addEventListener('aretes:sesion-vencida', () => { alert('Tu sesión venció. Vuelve a entrar.'); location.reload(); });

  async function estadoPuente(){
    try {
      const p = await Backend.estadoPuente();
      $('puenteTxt').innerHTML = p.online ? '<span style="color:#6ee7b7">● Conectado al SNITB</span>'
        : '<span style="color:#fcd34d">○ El SNITB no está disponible ahora (el digitador no está en línea). No se pueden verificar aretes.</span>';
    } catch (e) {}
  }

  function verSec(s){
    $('secNuevo').classList.toggle('oculto', s !== 'nuevo'); $('secMios').classList.toggle('oculto', s !== 'mios');
    $('navNuevo').classList.toggle('on', s === 'nuevo'); $('navMios').classList.toggle('on', s === 'mios');
    clearInterval(timerMios);
    if (s === 'mios') { cargarMios(); timerMios = setInterval(() => cargarMios(true), 15000); }
    window.scrollTo(0, 0);
  }
  function habilitar(n, on){ $('c' + n).classList.toggle('bloqueado', !on); }
  function marcarPaso(n, ok){ $('p' + n).classList.toggle('ok', ok); $('p' + n).querySelector('.n').textContent = ok ? '✓' : n; }

  /* ---------- paso 1: aretes ---------- */
  function leerCodigos(){
    const vistos = new Set();
    return $('aretesIn').value.split(/[^0-9]+/).map(x => x.length === 12 && x.startsWith('558') ? x.slice(3) : x)
      .filter(x => x.length >= 6 && x.length <= 12 && !vistos.has(x) && vistos.add(x));
  }
  async function verificarAretes(){
    const cods = leerCodigos(); const res = $('aretesRes');
    origen = null; aretesOk = []; destino = null; marcarPaso(1,false); marcarPaso(2,false); marcarPaso(3,false);
    habilitar(2,false); habilitar(3,false); habilitar(4,false); revisarListo();
    $('origenRes').innerHTML = '<div style="color:var(--muted);font-size:.92rem">Se llena solo con los aretes.</div>';
    $('destinoRes').innerHTML = '';
    if (!cods.length) { res.innerHTML = '<div class="msg msg-err">Escribe al menos un código de arete.</div>'; return; }
    if (cods.length > 100) { res.innerHTML = '<div class="msg msg-err">Máximo 100 aretes por movimiento.</div>'; return; }
    $('btnVerif').disabled = true;
    res.innerHTML = '<div class="msg msg-info"><span class="spin"></span>Consultando ' + cods.length + ' arete(s) en el SNITB…</div>';
    let r;
    try { const s = await Backend.mov.consultarAretes(cods.join(',')); r = await Backend.mov.esperar(s.jobId, 45000); }
    catch (e) { r = { status: 'error', message: e.message }; }
    $('btnVerif').disabled = false;
    if (r.status !== 'listo') {
      res.innerHTML = '<div class="msg msg-err">' + (r.status === 'timeout' ? 'El SNITB no respondió a tiempo. Intenta de nuevo.' : esc(r.message || 'No se pudo consultar el SNITB')) + '</div>';
      return;
    }
    const lista = r.datos.lista || [], no = r.datos.noEncontrados || [];
    const malos = lista.filter(a => a.estado !== 'ACTIVO');
    const fincas = [...new Set(lista.filter(a => a.estado === 'ACTIVO').map(a => a.cue))];
    let html = lista.map(a => `<div class="arete ${a.estado !== 'ACTIVO' ? 'mal' : ''}">
        <div><span class="cod">${esc(a.codigo)}</span><small>${esc(a.sexo === 'H' ? 'Hembra' : a.sexo === 'M' ? 'Macho' : a.sexo)} · ${esc(a.raza)}</small></div>
        <div style="text-align:right"><b style="color:${a.estado === 'ACTIVO' ? '#6ee7b7' : '#fca5a5'}">${esc(a.estado)}</b><small>${esc(a.finca)}</small></div></div>`).join('')
      + no.map(c => `<div class="arete mal"><div><span class="cod">${esc(c)}</span><small>No existe en el SNITB</small></div>
        <div style="text-align:right"><b style="color:#fca5a5">NO ENCONTRADO</b></div></div>`).join('');
    let problema = '';
    if (no.length) problema = 'Hay ' + no.length + ' arete(s) que no existen en el SNITB. Revisa los códigos.';
    else if (malos.length) problema = 'Hay ' + malos.length + ' arete(s) que no están ACTIVOS. Quítalos para continuar.';
    else if (fincas.length > 1) problema = 'Los aretes son de ' + fincas.length + ' fincas distintas. Un movimiento debe ser de una sola finca de origen.';
    if (problema) { res.innerHTML = html + '<div class="msg msg-err">' + problema + '</div>'; return; }

    aretesOk = lista.map(a => ({ codigo: a.codigo, sexo: a.sexo, raza: a.raza }));
    const a0 = lista[0];
    origen = { cupa: a0.cupa, nombre: a0.nombre, cue: a0.cue, finca: a0.finca };
    res.innerHTML = html + '<div class="msg msg-ok">✓ ' + lista.length + ' arete(s) activos, todos de la misma finca.</div>';
    marcarPaso(1, true); marcarPaso(2, true); habilitar(2, true); habilitar(3, true);
    $('origenRes').innerHTML = `<div class="dato"><span>Dueño</span><span>${esc(origen.nombre)}</span></div>
      <div class="dato"><span>CUPA</span><span>${esc(origen.cupa)}</span></div>
      <div class="dato"><span>Finca</span><span>${esc(origen.finca)}</span></div>
      <div class="dato" style="margin-bottom:0"><span>CUE</span><span>${esc(origen.cue)}</span></div>`;
    guardarBorrador(); $('cupaDest').focus();
  }

  /* ---------- paso 3: destino ---------- */
  async function buscarDestino(){
    const cupa = $('cupaDest').value.trim().toUpperCase(); const res = $('destinoRes');
    destino = null; marcarPaso(3, false); habilitar(4, false); revisarListo();
    if (!cupa) { res.innerHTML = '<div class="msg msg-err">Escribe la cédula o CUPA del comprador.</div>'; return; }
    if (origen && cupa.replace(/\s/g,'') === origen.cupa.toUpperCase()) { res.innerHTML = '<div class="msg msg-err">El comprador no puede ser el mismo vendedor.</div>'; return; }
    res.innerHTML = '<div class="msg msg-info"><span class="spin"></span>Buscando sus fincas en el SNITB…</div>';
    let r;
    try { const s = await Backend.mov.consultarCupa(cupa); r = await Backend.mov.esperar(s.jobId, 45000); }
    catch (e) { r = { status: 'error', message: e.message }; }
    if (r.status !== 'listo') { res.innerHTML = '<div class="msg msg-err">' + (r.status === 'timeout' ? 'El SNITB no respondió a tiempo.' : esc(r.message || 'No se pudo consultar')) + '</div>'; return; }
    const lista = (r.datos.lista || []).filter(f => !origen || f.cue !== origen.cue);
    const nombre = r.datos.nombreProductor || '';
    if (!lista.length) { res.innerHTML = '<div class="msg msg-err">Ese CUPA no tiene fincas registradas en el SNITB (o solo tiene la misma finca de origen).</div>'; return; }
    window._fincas = lista.map(f => ({ ...f, cupa, nombreProd: nombre }));
    res.innerHTML = (nombre ? '<div class="dato" style="margin-top:12px"><span>Comprador</span><span>' + esc(nombre) + '</span></div>' : '')
      + '<div class="lbl" style="margin-top:12px">' + (lista.length === 1 ? 'Finca de destino:' : 'Toca la finca de destino:') + '</div>'
      + lista.map((f, i) => `<button class="chip" id="f${i}" onclick="elegirFinca(${i})">🏡 <b>${esc(f.nombre || 'Finca')}</b><br>
          <small>CUE ${esc(f.cue)}${f.bovinos !== '' && f.bovinos != null ? ' · ' + esc(f.bovinos) + ' bovinos' : ''}</small></button>`).join('');
    if (lista.length === 1) elegirFinca(0);
  }
  function elegirFinca(i){
    const f = window._fincas[i];
    destino = { cupa: f.cupa, nombre: f.nombreProd, cue: f.cue, finca: f.nombre };
    document.querySelectorAll('#destinoRes .chip').forEach((c, k) => c.classList.toggle('sel', k === i));
    marcarPaso(3, true); habilitar(4, true); revisarListo(); guardarBorrador();
  }

  /* ---------- paso 4: foto (se reduce para que suba rápido) ---------- */
  function tomarFoto(inp){
    const file = inp.files && inp.files[0]; if (!file) return;
    const img = new Image();
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => { fotoBlob = b; fotoSubida = null; $('fotoPrev').src = URL.createObjectURL(b); $('fotoPrev').classList.remove('oculto'); revisarListo(); guardarFotoBorrador(); guardarBorrador(); },
                'image/jpeg', 0.72);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => alert('No se pudo leer la foto. Intenta con otra.');
    img.src = URL.createObjectURL(file);
  }
  function revisarListo(){
    const ok = !!(origen && destino && aretesOk.length && $('nodoc').value.trim() && fotoBlob);
    $('btnEnviar').disabled = !ok; marcarPaso(4, !!($('nodoc').value.trim() && fotoBlob));
  }

  /* ---------- enviar ---------- */
  function listaAnteriores(ant){
    return (ant || []).map(a => `<div class="dato"><span>#${a.id} · ${esc(a.fecha)}<br><small style="color:var(--muted)">${esc(a.usuario)} · ${esc(NOMBRE_ESTADO[a.estado] || a.estado)}</small></span>
      <span style="font-family:ui-monospace,Consolas,monospace">${(a.aretes || []).map(esc).join('<br>')}</span></div>`).join('');
  }
  async function enviar(confirmarRepetida){
    const btn = $('btnEnviar'), msg = $('enviarMsg');
    btn.disabled = true; msg.innerHTML = '<div class="msg msg-info"><span class="spin"></span>Subiendo la foto…</div>';
    try {
      if (!fotoSubida) { fotoSubida = await Backend.mov.subirFoto(fotoBlob); guardarBorrador(); }   // la foto se sube una sola vez
      msg.innerHTML = '<div class="msg msg-info"><span class="spin"></span>Guardando el movimiento…</div>';
      const doc = $('nodoc').value.trim();
      const r = await Backend.mov.crear({ aretes: aretesOk, nodoc: doc,
        cupaOrigen: origen.cupa, nombreOrigen: origen.nombre, cueOrigen: origen.cue, fincaOrigen: origen.finca,
        cupaDestino: destino.cupa, nombreDestino: destino.nombre, cueDestino: destino.cue, fincaDestino: destino.finca,
        fotoPath: fotoSubida, confirmarRepetida: !!confirmarRepetida });
      if (r.status === 'duplicado') {
        msg.innerHTML = `<div class="msg" style="background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fcd34d">
          <b>⚠️ La carta de venta ${esc(doc)} ya fue enviada antes:</b>
          <div style="margin:10px 0">${listaAnteriores(r.anteriores)}</div>
          Solo continúa si <b>la carta de venta tenía más aretes</b> que faltaron en el envío anterior.
          Antes de seguir, <b>revisa la carta de venta física</b>: el número, los aretes y el comprador.
          <label style="display:flex;gap:10px;align-items:flex-start;margin:12px 0;color:var(--text);cursor:pointer">
            <input type="checkbox" id="chkRep" style="width:24px;height:24px;flex:none" onchange="$('btnRep').disabled=!this.checked">
            <span>Revisé la carta de venta. Estos aretes (<b style="font-family:ui-monospace,Consolas,monospace">${aretesOk.map(a => esc(a.codigo)).join(', ')}</b>) son de esta carta y faltaron.</span></label>
          <button class="btn" id="btnRep" disabled onclick="enviar(true)" style="background:linear-gradient(135deg,#f59e0b,#B7791F)">Sí, enviar los aretes que faltaron</button>
          <button class="btn btn-ghost" style="margin-top:8px" onclick="$('enviarMsg').innerHTML='';revisarListo()">No, revisar el número</button></div>`;
        return;
      }
      if (r.status !== 'success') {
        msg.innerHTML = '<div class="msg msg-err">' + esc(r.message) + (r.anteriores ? '<div style="margin-top:10px">' + listaAnteriores(r.anteriores) + '</div>' : '') + '</div>';
        btn.disabled = false; return;
      }
      msg.innerHTML = '<div class="msg msg-ok">✅ Movimiento #' + r.id + ' enviado' + (r.repetida ? ' (aretes que faltaron de la carta ' + esc(doc) + ')' : '') + '. Lo puedes seguir en «Mis movimientos».</div>';
      limpiar();
      setTimeout(() => { msg.innerHTML = ''; verSec('mios'); }, 1800);
    } catch (e) { msg.innerHTML = '<div class="msg msg-err">' + esc(e.message) + '</div>'; btn.disabled = false; }
  }
  function limpiar(){
    try { localStorage.removeItem(BORRADOR); localStorage.removeItem(BORRADOR + '_foto'); } catch (e) {}
    origen = destino = null; aretesOk = []; fotoBlob = null; fotoSubida = null;
    $('aretesIn').value = ''; $('aretesRes').innerHTML = ''; $('cupaDest').value = ''; $('destinoRes').innerHTML = '';
    $('nodoc').value = ''; $('fotoIn').value = ''; $('fotoPrev').classList.add('oculto');
    $('origenRes').innerHTML = '<div style="color:var(--muted);font-size:.92rem">Se llena solo con los aretes.</div>';
    [1,2,3,4].forEach(n => marcarPaso(n, false)); [2,3,4].forEach(n => habilitar(n, false)); revisarListo();
  }

  /* ---------- mis movimientos ---------- */
  const NOMBRE_ESTADO = { PENDIENTE: 'En cola', REGISTRANDO: 'Registrando…', REGISTRADO: 'Registrado ✓', ERROR: 'Con error', ANULADO: 'Anulado' };
  let timerMios = null;
  async function cargarMios(silencioso){
    const cont = $('listaMios'); if (!silencioso) cont.innerHTML = '<div class="empty">Cargando…</div>';
    let l; try { l = await Backend.mov.mios(); } catch (e) { cont.innerHTML = '<div class="msg msg-err">' + esc(e.message) + '</div>'; return; }
    if (!l.length) { cont.innerHTML = '<div class="empty">📋<br>Todavía no has enviado movimientos.</div>'; return; }
    cont.innerHTML = l.map(m => `<div class="mov">
      <div class="h"><div><b>Carta de venta ${esc(m.nodoc)}</b>${m.repetida ? ' <small style="color:#fcd34d">(aretes que faltaron)</small>' : ''}<br><small style="color:var(--muted)">#${m.id} · ${esc(m.fecha)} · ${m.aretes.length} arete(s)</small></div>
        <span class="pill p-${m.estado}">${NOMBRE_ESTADO[m.estado] || esc(m.estado)}</span></div>
      <div class="dato"><span>De</span><span>${esc(m.nombreOrigen || m.cupaOrigen)}<br><small style="color:var(--muted)">${esc(m.fincaOrigen)}</small></span></div>
      <div class="dato" style="margin-bottom:0"><span>Para</span><span>${esc(m.nombreDestino || m.cupaDestino)}<br><small style="color:var(--muted)">${esc(m.fincaDestino)}</small></span></div>
      ${m.estado === 'ERROR' && m.error ? '<div class="msg msg-err">' + esc(m.error) + '</div>' : ''}
      ${m.snitbRef ? '<div style="font-size:.85rem;color:var(--muted);margin-top:8px">SNITB: ' + esc(m.snitbRef) + '</div>' : ''}
    </div>`).join('');
  }


  /* ---------- borrador: lo que se va llenando se guarda en el celular ----------
     Si el celular recarga la página (abrir la cámara, cambiar de app, poca memoria),
     al volver todo sigue lleno: aretes, origen, comprador, número y foto. */
  const BORRADOR = 'aretesapp_mov_borrador';
  let borradorListo = false;
  function guardarBorrador(){
    if (!borradorListo) return;   // aún no se ha cargado el borrador anterior
    try {
      const b = { t: Date.now(), aretesIn: $('aretesIn').value, aretesOk, origen, destino,
        aretesRes: $('aretesRes').innerHTML, origenRes: $('origenRes').innerHTML,
        cupaDest: $('cupaDest').value, destinoRes: $('destinoRes').innerHTML, fincas: window._fincas || null,
        nodoc: $('nodoc').value, fotoSubida };
      if (!b.aretesIn && !b.cupaDest && !b.nodoc && !fotoBlob) { localStorage.removeItem(BORRADOR); return; }
      localStorage.setItem(BORRADOR, JSON.stringify(b));
    } catch (e) {}
  }
  function guardarFotoBorrador(){
    if (!fotoBlob) { try { localStorage.removeItem(BORRADOR + '_foto'); } catch (e) {} return; }
    const fr = new FileReader();
    fr.onload = () => { try { localStorage.setItem(BORRADOR + '_foto', fr.result); } catch (e) {} };
    fr.readAsDataURL(fotoBlob);
  }
  async function recuperarBorrador(){
    let b; try { b = JSON.parse(localStorage.getItem(BORRADOR) || 'null'); } catch (e) {}
    borradorListo = true;
    if (!b || Date.now() - b.t > 12 * 3600 * 1000) { try { localStorage.removeItem(BORRADOR); localStorage.removeItem(BORRADOR + '_foto'); } catch (e) {} return; }
    $('aretesIn').value = b.aretesIn || ''; $('cupaDest').value = b.cupaDest || ''; $('nodoc').value = b.nodoc || '';
    aretesOk = b.aretesOk || []; origen = b.origen || null; destino = b.destino || null; fotoSubida = b.fotoSubida || null;
    window._fincas = b.fincas || null;
    if (b.aretesRes) $('aretesRes').innerHTML = b.aretesRes;
    if (b.origenRes) $('origenRes').innerHTML = b.origenRes;
    if (b.destinoRes) $('destinoRes').innerHTML = b.destinoRes;
    if (origen) { marcarPaso(1, true); marcarPaso(2, true); habilitar(2, true); habilitar(3, true); }
    if (destino) { marcarPaso(3, true); habilitar(4, true); }
    try {
      const d = localStorage.getItem(BORRADOR + '_foto');
      if (d) { fotoBlob = await (await fetch(d)).blob(); $('fotoPrev').src = d; $('fotoPrev').classList.remove('oculto'); }
    } catch (e) {}
    revisarListo();
    borradorListo = true;
    if (b.aretesIn || b.nodoc) $('enviarMsg').innerHTML = '<div class="msg msg-info">Se recuperó el movimiento que estabas llenando.</div>';
  }
  ['aretesIn','cupaDest','nodoc'].forEach(id => { const el = $(id); if (el) el.addEventListener('input', guardarBorrador); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') guardarBorrador(); });

  /* ---------- inicio ---------- */
  (function(){ const u = Backend.mov.usuarioGuardado(); if (u) { abrirApp(u); recuperarBorrador(); } })();
</script>
